name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # postinstall runs `prisma generate`, so the build has the client.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
